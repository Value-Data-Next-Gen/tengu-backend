# Auto-deploy a Azure App Service (tengu-backend).
# Single-job (sin artifact) para esquivar el quota de Actions storage de la org.
# El build real lo hace Oryx en Azure (SCM_DO_BUILD_DURING_DEPLOYMENT=true).

name: Build and deploy Python app to Azure Web App - tengu-backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Validación temprana: si requirements.txt está roto, lo agarramos acá
      # antes de pegarle a Azure. No subimos venv ni artifact.
      - name: Validate requirements install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4D64189D0C574098B53C03561CD3A54F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_343BD68EBF0746B38C27EBFDF6FB894B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_23EB6AC40F564F13A22C2005C0C02CD7 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: tengu-backend
          slot-name: Production
          package: .
